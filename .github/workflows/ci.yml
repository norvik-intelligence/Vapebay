name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # Ein neuer Push auf denselben Branch bricht den laufenden Lauf ab — CI-Zeit
  # für einen Stand zu verbrennen, den es nicht mehr gibt, hilft niemandem.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Unit · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Der Runtime-Bootstrap (Vercel-Kaltstart, frisches Docker-Volume) liest
      # drizzle/0000_init.sql. Wenn das Schema geändert wurde, ohne den Ordner
      # neu zu generieren, fällt das sonst erst in der laufenden Preview auf —
      # hier fällt es sofort.
      - name: Schema-Drift-Guard (drizzle/ aktuell?)
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::drizzle/ ist nicht aktuell. 'npm run db:generate' ausführen und committen."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests (Vitest)
        run: npm run test

      - name: Produktionsbuild
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      # Läuft gegen den echten Build; die Datenbank bootstrapt der Server beim
      # ersten Zugriff selbst — derselbe Pfad wie ein Vercel-Kaltstart.
      - name: E2E-Tests (Playwright)
        run: npm run test:e2e

      - name: Fehlerkontexte sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
